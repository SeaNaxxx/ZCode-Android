# Embedded-runtime APK build + offline emulator verification.
#
# 1. The APK embeds Node.js + ZCode + all dependencies at build time; first
#    app run must provision OFFLINE.
# 2. The x86_64 AVD proves app logic only; ARM64 verification happens on the
#    acceptance device (see docs/ENGINEERING-NOTES.md section 4).
# 3. The agent loop must be verified by effects on disk, not by app messages.
#
# Manual trigger only: emulator runs are expensive; start them deliberately.

name: android-verify

on:
  workflow_dispatch: {}

permissions:
  contents: write   # prerelease publishing (direct .apk downloads, no zip wrapper)
  actions: read

env:
  UPSTREAM_PIN: 3c5b227649371507ddc4eb46ac5133afe6db1cab
  PNPM_VERSION: "10.33.2"
  # API 33 DELIBERATELY MATCHES THE ACCEPTANCE DEVICE (Vivo V2035, Android 13).
  # The 0.3.0/0.3.1 device failures happened on API 33 while CI ran an API 34
  # emulator: java.nio.file.Path.of (API 34+) worked in CI and crashed on the
  # device with NoSuchMethodError. CI must never again be MORE capable than
  # the device in ways that mask app-API defects.
  SYSTEM_IMAGE: "system-images;android-33;google_apis;x86_64"
  PKG: io.github.zcodeandroid.app
  RT: /data/data/io.github.zcodeandroid.app/files/runtime
  WS: /data/data/io.github.zcodeandroid.app/files/workspace
  RESULTS_DIR: /tmp/verify-results
  LOGS_DIR: /tmp/verify-logs

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record build context
        run: |
          mkdir -p "$RESULTS_DIR" "$LOGS_DIR"
          {
            echo "arch=$(uname -m) kernel=$(uname -r)"
            echo "upstream_pin=$UPSTREAM_PIN"
            echo "branch=${GITHUB_REF_NAME} commit=${GITHUB_SHA}"
          } | tee "$LOGS_DIR/build-context.txt"

      - name: "Unit tests — failure-2 regression guards (env contract, extraction, API compat)"
        run: |
          # JVM-only tests; they encode the Vivo V2035 device evidence:
          #  - BionicEnvTest: OPENSSL_CONF/SSL_CERT_FILE/OPENSSL_MODULES point
          #    inside the app runtime, never at com.termux, TLS never weakened;
          #  - TarExtractorTest: Vivo-like link refusals fall back to a
          #    budgeted copy; NoSuchMethodError fails as APP DEFECT;
          #  - ApiCompatSourceTest: no java.nio.file.Path.of (API 34+) anywhere.
          ( cd android && chmod +x gradlew && ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace ) \
            > "$LOGS_DIR/gradle-unit-tests.log" 2>&1 \
            || { tail -n 250 "$LOGS_DIR/gradle-unit-tests.log"; exit 1; }
          grep -E "BUILD (SUCCESSFUL|FAILED)" "$LOGS_DIR/gradle-unit-tests.log" | tail -1

      - name: Checkout upstream at pinned commit
        uses: actions/checkout@v4
        with:
          repository: zai-org/ZCode
          ref: ${{ env.UPSTREAM_PIN }}
          path: upstream
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install upstream dependencies
        working-directory: upstream
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages (cli deps + server + web + tui)
        working-directory: upstream
        run: |
          pnpm --filter @zcode/cli... build
          pnpm --filter @zcode/server... build
          pnpm --filter @zcode/web build
          pnpm --filter @zcode/tui... build

      - name: Stage @zcode/shared dist (esbuild; upstream gap at pinned commit)
        working-directory: upstream
        run: |
          mkdir -p packages/shared/dist
          pnpm exec esbuild packages/shared/src/index.ts \
            --bundle --platform=node --format=esm \
            --outfile=packages/shared/dist/index.js --log-level=warning
          ls -la packages/shared/dist/

      - name: Build official ZCode CLI distribution
        working-directory: upstream
        run: pnpm build:zcode --base-url https://downloads.invalid/zcode-android/

      - name: Locate distribution artifacts
        id: dist
        run: |
          set -e
          TARBALL=$(find upstream/dist/zcode/releases -name 'zcode-*.tar.gz' | head -1)
          test -n "$TARBALL" || { echo "dist tarball not found"; exit 1; }
          SHA=$(sha256sum "$TARBALL" | awk '{print $1}')
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "dist: $TARBALL sha256=$SHA ($(du -h "$TARBALL" | cut -f1))"

      - name: Build Bionic bundles (aarch64 + x86_64, sha256-verified closure)
        run: |
          set -e
          python3 scripts/embedded/build-bionic-bundle.py aarch64  /tmp/bundle-work "$LOGS_DIR/bundle-out"
          python3 scripts/embedded/build-bionic-bundle.py x86_64 /tmp/bundle-work "$LOGS_DIR/bundle-out"
          echo "--- bundle sizes ---"
          ls -la "$LOGS_DIR/bundle-out/"
          python3 - <<'PY'
          import json
          for a in ("aarch64", "x86_64"):
              m = json.load(open(f"/tmp/verify-logs/bundle-out/manifest-{a}.json"))
              print(f"[{a}] node={m['node']} packages={len(m['packages'])} "
                    f"audit={m['audit']['elfs_scanned']} ELFs, "
                    f"unsatisfied={m['audit']['unsatisfied_needed']} "
                    f"symlinks_rewritten={m['symlinksRewritten']} "
                    f"baked_prefix_strings={m['bakedTermuxPrefixStrings']}")
          PY

      - name: Stage embedded assets (aarch64) + build APK
        run: |
          set -e
          mkdir -p android/app/src/main/assets/runtime/bionic
          cp "$LOGS_DIR/bundle-out/prefix-aarch64.tgz" android/app/src/main/assets/runtime/bionic/prefix.tgz
          cp "$LOGS_DIR/bundle-out/prefix-aarch64.sha256" android/app/src/main/assets/runtime/bionic/prefix.sha256
          cp "$LOGS_DIR/bundle-out/prefix-aarch64.critical.txt" android/app/src/main/assets/runtime/bionic/prefix.critical.txt
          cp "$LOGS_DIR/bundle-out/manifest-aarch64.json" android/app/src/main/assets/runtime/bionic/manifest.json
          cp scripts/embedded/assets/verify-mock-provider.cjs scripts/embedded/assets/verify-agent-driver.cjs \
             scripts/embedded/assets/verify-mock-provider-config.json \
             scripts/embedded/assets/register-workspace-project.cjs android/app/src/main/assets/runtime/bionic/
          cp "${{ steps.dist.outputs.tarball }}" android/app/src/main/assets/runtime/zcode-dist.tgz
          echo "${{ steps.dist.outputs.sha256 }}" > android/app/src/main/assets/runtime/zcode-dist.sha256
          ls -la android/app/src/main/assets/runtime android/app/src/main/assets/runtime/bionic
          ( cd android && chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon --stacktrace ) \
            > "$LOGS_DIR/gradle-arm64.log" 2>&1 || { tail -n 250 "$LOGS_DIR/gradle-arm64.log"; exit 1; }
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$APK" "$LOGS_DIR/zcode-android-arm64-debug.apk"
          echo "arm64 APK: $(du -h "$APK" | cut -f1)"

      - name: Verify aarch64 APK contents
        run: |
          set -e
          APK="$LOGS_DIR/zcode-android-arm64-debug.apk"
          for entry in \
            assets/runtime/zcode-dist.tgz \
            assets/runtime/zcode-dist.sha256 \
            assets/runtime/bionic/prefix.tgz \
            assets/runtime/bionic/prefix.sha256 \
            assets/runtime/bionic/prefix.critical.txt \
            assets/runtime/bionic/manifest.json \
            assets/runtime/bionic/verify-mock-provider.cjs \
            assets/runtime/bionic/verify-agent-driver.cjs \
            assets/runtime/bionic/verify-mock-provider-config.json \
            assets/runtime/bionic/register-workspace-project.cjs ; do
            unzip -Z1 "$APK" | grep -qx "$entry" || { echo "FATAL: $entry missing from APK"; exit 1; }
          done
          echo "aarch64 APK content checks passed (all embedded entries present)"

      - name: Stage embedded assets (x86_64) + rebuild APK
        run: |
          set -e
          cp "$LOGS_DIR/bundle-out/prefix-x86_64.tgz" android/app/src/main/assets/runtime/bionic/prefix.tgz
          cp "$LOGS_DIR/bundle-out/prefix-x86_64.sha256" android/app/src/main/assets/runtime/bionic/prefix.sha256
          cp "$LOGS_DIR/bundle-out/prefix-x86_64.critical.txt" android/app/src/main/assets/runtime/bionic/prefix.critical.txt
          cp "$LOGS_DIR/bundle-out/manifest-x86_64.json" android/app/src/main/assets/runtime/bionic/manifest.json
          ( cd android && chmod +x gradlew && ./gradlew clean :app:assembleDebug --no-daemon --stacktrace ) \
            > "$LOGS_DIR/gradle-x86_64.log" 2>&1 || { tail -n 250 "$LOGS_DIR/gradle-x86_64.log"; exit 1; }
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$APK" "$LOGS_DIR/zcode-android-x86_64-debug.apk"
          unzip -Z1 "$APK" | grep -qx "assets/runtime/bionic/prefix.tgz" \
            || { echo "FATAL: x86_64 APK missing prefix bundle"; exit 1; }
          echo "x86_64 APK: $(du -h "$APK" | cut -f1)"
          echo "--- final APK sizes (compressed) ---"
          ls -la "$LOGS_DIR"/zcode-android-*.apk

      - name: Publish prerelease (direct .apk downloads, phone-friendly)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # TAG DERIVED FROM versionName: every version bump gets its own release
          # tag automatically — no silent asset overwrite with an ambiguous label.
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          TAG="$VERSION"
          echo "release tag: $TAG (from versionName $VERSION)"
          API="https://api.github.com/repos/${{ github.repository }}"
          AUTH="Authorization: Bearer $GH_TOKEN"
          REL_CODE=$(curl -s -o /tmp/rel.json -w '%{http_code}' -X POST "$API/releases" \
            -H "$AUTH" -H "Accept: application/vnd.github+json" \
            -d "{\"tag_name\":\"$TAG\",\"target_commitish\":\"$GITHUB_SHA\",\"name\":\"ZCode-Android $VERSION\",\"prerelease\":true,\"body\":\"Android debug build (arm64). Installs the embedded runtime; first launch provisions offline. See docs/ENGINEERING-NOTES.md for the verification model.\"}")
          if [ "$REL_CODE" != "201" ]; then
            echo "release create -> HTTP $REL_CODE (fetching existing)"
            RELEASE_ID=$(curl -s -H "$AUTH" "$API/releases/tags/$TAG" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          else
            RELEASE_ID=$(python3 -c 'import json; print(json.load(open("/tmp/rel.json"))["id"])')
          fi
          echo "release id: $RELEASE_ID"
          for APK in "$LOGS_DIR"/zcode-android-arm64-debug.apk; do
            NAME=$(basename "$APK")
            # delete stale asset with the same name (idempotent re-runs);
            # pass the name as argv — shell vars are NOT exported to python
            for ASSET_ID in $(curl -s -H "$AUTH" "$API/releases/$RELEASE_ID/assets?per_page=100" \
                                | python3 -c 'import json,sys; [print(a["id"]) for a in json.load(sys.stdin) if a["name"]==sys.argv[1]]' "$NAME"); do
              echo "deleting stale asset $NAME ($ASSET_ID)"
              curl -s -X DELETE -H "$AUTH" "$API/releases/assets/$ASSET_ID" || true
              sleep 2
            done
            echo "uploading $NAME"
            CODE=$(curl -s -o /tmp/up.json -w '%{http_code}' -X POST \
              -H "$AUTH" -H "Content-Type: application/octet-stream" \
              --data-binary "@$APK" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$NAME")
            if [ "$CODE" != "201" ]; then
              echo "upload -> HTTP $CODE; one retry after forced stale-asset cleanup"
              curl -s -H "$AUTH" "$API/releases/$RELEASE_ID/assets?per_page=100" \
                | python3 -c 'import json,sys; [print(a["id"]) for a in json.load(sys.stdin) if a["name"]==sys.argv[1]]' "$NAME" \
                | while read -r ASSET_ID; do curl -s -X DELETE -H "$AUTH" "$API/releases/assets/$ASSET_ID" || true; done
              sleep 3
              CODE=$(curl -s -o /tmp/up.json -w '%{http_code}' -X POST \
                -H "$AUTH" -H "Content-Type: application/octet-stream" \
                --data-binary "@$APK" \
                "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$NAME")
            fi
            [ "$CODE" = "201" ] || { echo "FATAL: asset upload $NAME -> HTTP $CODE"; cat /tmp/up.json; exit 1; }
            echo "uploaded: $NAME"
          done
          echo "release URL: https://github.com/${{ github.repository }}/releases/tag/$TAG"

      - name: "Upload APK artifacts — separate per ABI"
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64
          path: /tmp/verify-logs/zcode-android-arm64-debug.apk
          if-no-files-found: error

      - name: Upload x86_64 APK artifact (emulator job input only, 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: apk-x86_64
          path: /tmp/verify-logs/zcode-android-x86_64-debug.apk
          retention-days: 1
          if-no-files-found: error

      - name: Upload build logs + bundle manifests
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/verify-logs/bundle-out/**
            /tmp/verify-logs/build-context.txt
          if-no-files-found: error

  verify-x86_64:
    # Proves the APP-level flow only (x86_64 AVD): offline provisioning from
    # embedded assets, embedded node exec, official dist web server, on-device
    # agent loop (Write/Bash/git verified by disk effects), restart persistence.
    # NOT proof of ARM64 or of the Vivo device — those rows stay NOT TESTED here.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout (helper scripts)
        uses: actions/checkout@v4

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: apk-x86_64
          path: /tmp/apks

      - name: Prepare stage helpers + logs dirs
        run: |
          mkdir -p "$RESULTS_DIR" "$LOGS_DIR" /tmp/apks
          ls -la /tmp/apks
          cat > /tmp/verify-render-verdict.py <<'EOF'
          # HONEST RENDER VERDICT: green means the ZCode UI actually renders
          # inside the WebView. Parses the failure-3 probe evidence from the
          # stage logcat and fails when the owner-reported black screen is
          # present (html/#root collapsed, card clipped, uniform bitmap).
          import json, re, sys
          log = open(sys.argv[1], errors="replace").read()
          fails = []
          vs_lines = [l for l in log.splitlines() if "[probe] visual-state" in l]
          if not vs_lines:
              print("FAIL: no visual-state probe evidence"); sys.exit(1)
          m = re.search(r'visual-state[^:]*: "(.*)"\s*$', vs_lines[-1])
          if not m:
              print("FAIL: cannot parse visual-state line"); sys.exit(1)
          try:
              d = json.loads(m.group(1).replace('\\"', '"'))
          except Exception as e:
              print("FAIL: visual-state JSON parse: " + str(e)); sys.exit(1)
          inner = str(d.get("vp", {}).get("inner", "0x0"))
          ih = int(inner.split("x")[1]) if "x" in inner else 0
          if ih < 300: fails.append("JS viewport too small: inner=" + inner)
          heights = d.get("heights", [])
          def css_h(line):
              m2 = re.search(r"cssH=(-?[0-9.]+)px", line or "")
              return float(m2.group(1)) if m2 else -1.0
          html_line = next((h for h in heights if h.startswith("html")), "")
          root_line = next((h for h in heights if h.startswith("#root")), "")
          html_h = css_h(html_line)
          root_h = css_h(root_line)
          if html_h <= 0: fails.append("html cssH=" + str(html_h) + " (viewport chain still collapsed)")
          if root_h <= 0: fails.append("#root cssH=" + str(root_h))
          nodes = d.get("nodes", [])
          sec = next((n for n in nodes if n.startswith("section")), None)
          if sec:
              m3 = re.search(r"\[(-?\d+),(-?\d+) (\d+)x(\d+)\]", sec)
              if m3:
                  x, y, w, h = (int(g) for g in m3.groups())
                  if y < 0: fails.append("welcome card clipped above viewport: y=" + str(y))
                  elif y + h > ih + 60: fails.append("welcome card below viewport: y=" + str(y) + " h=" + str(h) + " inner=" + str(ih))
                  else: print("welcome card visible: rect y=" + str(y) + " h=" + str(h))
              else:
                  fails.append("cannot parse section rect: " + sec[:80])
          else:
              fails.append("no section node in DOM walk (login card missing)")
          bm = re.findall(r"bitmap\[before\]: .*?distinctColors=(\d+)", log)
          if not bm:
              fails.append("no bitmap[before] evidence")
          else:
              colors = int(bm[-1])
              if colors < 2: fails.append("bitmap[before] uniform (distinctColors=" + str(colors) + ") = black screen")
              else: print("bitmap[before] distinctColors=" + str(colors))
          shim = re.findall(r"\[zcode-shim\] (.*)", log)
          for line in shim[-4:]: print("shim: " + line)
          for f in fails: print("FAIL: " + f)
          if fails: sys.exit(1)
          print("RENDER VERDICT: UI RENDERS (heights real, card visible, non-uniform bitmap)")
          EOF
          cat > /tmp/verify-stage-lib.sh <<'EOF'
          _emit_result() {
            python3 - "$RESULTS_DIR" "$1" "$2" "$3" "$4" <<'PY'
          import json, os, sys, datetime
          d, name, status, rc, note = sys.argv[1:6]
          payload = {"stage": name, "status": status, "exit_code": int(rc),
                     "note": note, "at": datetime.datetime.utcnow().isoformat() + "Z"}
          with open(os.path.join(d, name + ".json"), "w") as f:
              json.dump(payload, f, indent=2)
          print(json.dumps(payload))
          PY
          }
          stage_run() {
            local name="$1"; shift
            [ "${1:-}" = "--" ] && shift
            local log="$LOGS_DIR/$name.log"
            echo "::group::[stage] $name"
            set +e
            "$@" > "$log" 2>&1
            local rc=$?
            set -e
            if [ $rc -eq 0 ]; then _emit_result "$name" "PASS" "$rc" "see $log";
            else _emit_result "$name" "FAIL" "$rc" "see $log"; tail -n 40 "$log"; fi
            echo "::endgroup::"
            return $rc
          }
          block() { # block <name> <reason>
            _emit_result "$1" "BLOCKED" -1 "$2"
            echo "[stage] $1 BLOCKED: $2"
            return 1
          }
          adb() { "$ANDROID_HOME/platform-tools/adb" "$@"; }
          ui_dump() {
            # STALE-DUMP GUARD (run 40609670756): when uiautomator cannot dump
            # (wedged SystemUI), the PREVIOUS dump must not be reused — every
            # consumer grepped the old XML, dismissed the same stale "Wait"
            # bounds forever, and dismiss_anr -> ui_tap_text -> dismiss_anr
            # recursed in milliseconds. Delete before dumping; a failed dump
            # now reads as "no information", never as stale truth.
            rm -f "$LOGS_DIR/ui-dump.xml"
            adb shell uiautomator dump /sdcard/window_dump.xml > /dev/null 2>&1 || true
            adb pull /sdcard/window_dump.xml "$LOGS_DIR/ui-dump.xml" > /dev/null 2>&1 || true
            [ -f "$LOGS_DIR/ui-dump.xml" ]
          }
          ui_has_text() {
            ui_dump || return 1
            python3 - "$1" <<'PY'
          import os, re, sys
          p = os.path.join(os.environ["LOGS_DIR"], "ui-dump.xml")
          try:
              t = open(p, encoding="utf-8", errors="replace").read()
          except OSError:
              sys.exit(1)
          want = re.escape(sys.argv[1])
          # substring match inside the text/content-desc attribute value
          # (status texts append suffixes, e.g. "Running — http://127.0.0.1:3030")
          sys.exit(0 if re.search(r'(?:text|content-desc)="[^"]*%s[^"]*"' % want, t) else 1)
          PY
          }
          ui_tap_text() { # ui_tap_text <text> <timeout_s>
            local text="$1" deadline=$((SECONDS + ${2:-60}))
            while [ $SECONDS -lt $deadline ]; do
              if ui_has_text "$text"; then
                local c
                c=$(python3 - "$text" <<'PY'
          import os, re, sys
          p = os.path.join(os.environ["LOGS_DIR"], "ui-dump.xml")
          t = open(p, encoding="utf-8", errors="replace").read()
          want = re.escape(sys.argv[1])
          m = re.findall(r'(?:text|content-desc)="[^"]*%s[^"]*"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"' % want, t)
          if not m:
              sys.exit(1)
          x1, y1, x2, y2 = map(int, m[0])
          print((x1 + x2) // 2, (y1 + y2) // 2)
          PY
          ) || { sleep 3; continue; }
                echo "tapping '\''$text'\'' at ($c)"
                adb shell input tap $c
                return 0
              fi
              dismiss_anr || true
              sleep 3
            done
            echo "UI text not found within ${2:-60}s: $text"
            return 1
          }
          dismiss_anr() {
            # SINGLE ATTEMPT, NO RECURSION: this function is called from
            # ui_tap_text's wait loop, so calling ui_tap_text back recursed
            # (dismiss_anr -> ui_tap_text -> dismiss_anr -> ...) when dumps
            # failed while a stale XML still matched. Tap straight from the
            # current dump; fall back to the ENTER key; always return.
            rm -f "$LOGS_DIR/ui-dump.xml"
            ui_dump || return 0
            grep -q "isn't responding" "$LOGS_DIR/ui-dump.xml" 2>/dev/null || return 0
            echo "ANR dialog detected -> tapping Wait (single attempt)"
            local c
            c=$(python3 - "Wait" <<'PY'
          import os, re, sys
          p = os.path.join(os.environ["LOGS_DIR"], "ui-dump.xml")
          try:
              t = open(p, encoding="utf-8", errors="replace").read()
          except OSError:
              sys.exit(1)
          m = re.findall(r'(?:text|content-desc)="[^"]*Wait[^"]*"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', t)
          if not m:
              sys.exit(1)
          print((int(m[0][0]) + int(m[0][2])) // 2, (int(m[0][1]) + int(m[0][3])) // 2)
          PY
          ) || { adb shell input keyevent KEYCODE_ENTER || true; sleep 5; return 0; }
            adb shell input tap $c || true
            sleep 5
          }
          shot() { adb exec-out screencap -p > "$LOGS_DIR/screen-$1.png" 2>/dev/null || true; }
          # stage_run runs stages via `bash -c` child shells — functions must
          # be exported or the child fails with "adb: command not found" (this
          # exact failure happened in run #1: classification = workflow/setup).
          export -f _emit_result stage_run block adb ui_dump ui_has_text ui_tap_text dismiss_anr shot
          EOF
          # standalone helper (kept OUT of single-quoted bash -c blocks: a
          # quoted heredoc delimiter inside '...' terminates the outer string —
          # exact bug class of run 40630785519 / commit d1c1780)
          cat > /tmp/verify-webview-bounds.py <<'PY'
          import os, re
          p = os.path.join(os.environ["LOGS_DIR"], "frontend-smoke-ui.xml")
          try:
              t = open(p, encoding="utf-8", errors="replace").read()
          except OSError:
              t = ""
          for m in re.finditer(r'<node[^>]*class="android\.webkit\.WebView"[^>]*>', t):
              b = re.search(r'bounds="(\[[^"]+\])"', m.group(0))
              print("WEBVIEW-BOUNDS:", b.group(1) if b else "?")
          PY
          # env wrapper executed ON DEVICE under run-as (embedded layout, app prefix)
          cat > /tmp/verify-run.sh <<EOF
          #!/system/bin/sh
          PREFIX=$RT/usr
          export PREFIX
          export HOME=$RT/home
          export TMPDIR=\$HOME/tmp
          mkdir -p "\$TMPDIR" 2>/dev/null
          export PATH=\$PREFIX/bin:/system/bin:/system/xbin
          export LD_LIBRARY_PATH=\$PREFIX/lib
          export SHELL=\$PREFIX/bin/bash
          export LANG=C.UTF-8
          export SSL_CERT_FILE=\$PREFIX/etc/tls/cert.pem
          # OpenSSL wiring mirrors the app's BionicEnv (device failure 2 fix):
          # the Termux-built libcrypto has OPENSSLDIR compiled in as
          # /data/data/com.termux/... which is EACCES for this app and FATAL
          # at node startup. OPENSSL_CONF must ALWAYS point at a readable
          # file INSIDE the runtime.
          export OPENSSL_CONF=\$PREFIX/etc/tls/openssl.cnf
          [ -f "\$OPENSSL_CONF" ] || { echo "FATAL: openssl.cnf missing at \$OPENSSL_CONF"; exit 13; }
          [ -d "\$PREFIX/lib/ossl-modules" ] && export OPENSSL_MODULES=\$PREFIX/lib/ossl-modules
          export GIT_SSL_CAINFO=\$SSL_CERT_FILE
          [ -d "\$PREFIX/share/git-core/templates" ] && export GIT_TEMPLATE_DIR=\$PREFIX/share/git-core/templates
          export GIT_EXEC_PATH=\$PREFIX/libexec/git-core
          export GIT_CONFIG_NOSYSTEM=1
          export PAGER=cat GIT_PAGER=cat
          export NODE_OPTIONS=
          export ZCODE_DATA_BASE_DIR=$RT/zcode-data
          exec "\$@"
          EOF
          echo "helpers ready"

      - name: Enable KVM access (proven udev rule)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Free disk space + emulator deps (proven pattern)
        run: |
          sudo apt-get update -qq > /dev/null 2>&1 || true
          sudo apt-get install -y -qq libpulse0 > /dev/null 2>&1 || echo "WARN: libpulse0 install failed"
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/ndk-bundle \
            /usr/local/lib/android/sdk/extras /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 || true
          docker image prune -af > /dev/null 2>&1 || true
          df -h / | tail -1

      - name: emu-boot | boot AVD and enable root
        run: |
          source /tmp/verify-stage-lib.sh
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export SYSTEM_IMAGE
          export SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          export AVDM="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          stage_run emu-boot -- bash -c '
            set -e
            export PATH="$ANDROID_HOME/platform-tools:$PATH"
            mkdir -p "$ANDROID_AVD_HOME"
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" --install "$SYSTEM_IMAGE" emulator platform-tools > "$LOGS_DIR/sdkmanager.log" 2>&1
            echo no | "$AVDM" create avd -n avd33 -k "$SYSTEM_IMAGE" -d pixel_5 --force > "$LOGS_DIR/avdmanager.log" 2>&1
            # more CPU/RAM for the AVD: SystemUI ANRed under software rendering
            # on the runner in run #3 (classification = workflow/setup)
            { echo "hw.cpu.ncore=4"; echo "hw.ramSize=6144"; } >> "$ANDROID_AVD_HOME/avd33.avd/config.ini"
            nohup "$ANDROID_HOME/emulator/emulator" -avd avd33 \
              -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics \
              -gpu swiftshader_indirect -accel on -partition-size 4096 \
              -feature -Vulkan \
              > "$LOGS_DIR/emulator.log" 2>&1 &
            EMU_OK=0
            for i in $(seq 1 12); do
              sleep 5
              if pgrep -f qemu-system > /dev/null 2>&1; then EMU_OK=1; echo "emulator alive after $((i*5))s"; break; fi
            done
            [ "$EMU_OK" = "1" ] || { echo "FATAL: emulator died at launch"; tail -n 80 "$LOGS_DIR/emulator.log"; exit 1; }
            timeout 300 adb wait-for-device || { echo "FATAL: wait-for-device timeout"; tail -n 80 "$LOGS_DIR/emulator.log"; exit 1; }
            BOOTED=0
            for i in $(seq 1 180); do
              b=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" || true)
              if [ "$b" = "1" ]; then BOOTED=1; echo "boot completed after ~$((i*5))s"; break; fi
              pgrep -f qemu-system > /dev/null 2>&1 || { echo "FATAL: emulator died mid-boot"; tail -n 80 "$LOGS_DIR/emulator.log"; exit 1; }
              sleep 5
            done
            [ "$BOOTED" = "1" ] || { echo "FATAL: boot_completed never set"; tail -n 80 "$LOGS_DIR/emulator.log"; exit 1; }
            adb root || true
            sleep 3
            timeout 120 adb wait-for-device || true
            adb shell setenforce 0
            adb shell settings put global window_animation_scale 0.0 || true
            adb shell settings put global transition_animation_scale 0.0 || true
            adb shell settings put global animator_duration_scale 0.0 || true
            echo "sdk: $(adb shell getprop ro.build.version.sdk | tr -d "\r")  abi: $(adb shell getprop ro.product.cpu.abi | tr -d "\r")"
          '
          if [ ! -f "$RESULTS_DIR/emu-boot.json" ] || ! grep -q '"PASS"' "$RESULTS_DIR/emu-boot.json"; then
            echo "HARD GATE: emulator boot failed — stopping"; exit 1
          fi

      - name: install | install app APK (embedded assets)
        run: |
          source /tmp/verify-stage-lib.sh
          stage_run install -- bash -c '
            set -e
            APK=$(ls /tmp/apks/zcode-android-x86_64-debug.apk)
            echo "installing: $APK ($(du -h "$APK" | cut -f1))"
            # NOTE: never redirect into $LOGS_DIR/install.log here — stage_run
            # already captures this whole script to that exact file (run #2:
            # inner redirect self-clobbered the failure output, classification
            # = workflow/setup).
            adb install -r "$APK" || {
              echo "--- install failed; diagnostics ---"
              df -h / | tail -2
              adb shell df -h /data 2>/dev/null | tail -3 || true
              adb logcat -d 2>/dev/null | tail -30 || true
              exit 1
            }
            # Android 13 POST_NOTIFICATIONS: the app asks on service (re)start;
            # the system dialog would cover the app window and hide its texts
            # from uiautomator (persistence FAIL in run 40555932163 —
            # screenshot proved Ready state behind the dialog). Pre-grant it.
            adb shell pm grant '"$PKG"' android.permission.POST_NOTIFICATIONS 2>/dev/null || true
            adb shell svc power stayon usb || true
            # settle time: SystemUI ANR dialogs right after install covered
            # the app in run #3
            sleep 20
            dismiss_anr || true
            shot installed
          '

      - name: offline | cut all connectivity BEFORE first launch
        run: |
          source /tmp/verify-stage-lib.sh
          stage_run offline -- bash -c '
            set -e
            adb shell cmd connectivity airplane-mode enable
            sleep 2
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            sleep 2
            echo "airplane mode: $(adb shell settings get global airplane_mode_on | tr -d "\r")"
            if adb shell ping -c 1 -W 2 8.8.8.8 > /tmp/ping.log 2>&1; then
              echo "FATAL: network still reachable — offline precondition failed"; cat /tmp/ping.log; exit 1
            fi
            echo "offline precondition OK (8.8.8.8 unreachable) — every later success is download-free"
          '

      - name: setup-tap | drive "Set up local runtime" offline
        run: |
          source /tmp/verify-stage-lib.sh
          stage_run setup-tap -- bash -c '
            set -e
            sleep 10
            dismiss_anr || true
            adb shell am start -n '"$PKG"'/.MainActivity > /dev/null
            sleep 6
            shot before-setup
            adb logcat -c || true
            ui_tap_text "Set up local runtime" 240 || exit 1
            OK=0
            for i in $(seq 1 160); do
              if ui_has_text "Ready"; then OK=1; echo "provisioned (Ready) after ~$((i*3))s"; break; fi
              if ui_has_text "Failed"; then
                echo "setup FAILED on-device"; ui_dump; grep -o "Failed[^<]*" "$LOGS_DIR/ui-dump.xml" | head -3
                adb logcat -d | tail -40
                break
              fi
              sleep 3
            done
            shot after-setup
            [ "$OK" = "1" ] || { echo "setup did not reach Ready offline"; exit 1; }
            adb shell run-as '"$PKG"' cat files/runtime/provision-complete.json
            echo "--- provisioning log lines from device (app RuntimeBus) ---"
            adb shell run-as '"$PKG"' cat files/runtime/provision-complete.json > /dev/null
          '

      - name: node-probe | embedded node really runs (device-side evidence)
        run: |
          source /tmp/verify-stage-lib.sh
          adb push /tmp/verify-run.sh /data/local/tmp/verify-run.sh > /dev/null
          adb shell chmod 755 /data/local/tmp/verify-run.sh
          # probe as a FILE: inline `node -e "...(...)"` gets mangled by adb
          # shell quoting (run #4: sh syntax error on parens) — workflow/setup
          cat > /tmp/verify-probe.cjs <<'EOF'
          console.log(JSON.stringify({node: process.version, platform: process.platform,
            arch: process.arch, execPath: process.execPath}));
          EOF
          adb push /tmp/verify-probe.cjs /data/local/tmp/verify-probe.cjs > /dev/null
          stage_run node-probe -- bash -c '
            set -e
            echo "--- run-as wrapper: node --version ---"
            adb shell run-as '"$PKG"' sh /data/local/tmp/verify-run.sh node --version
            echo "--- run-as wrapper: platform/arch (probe file) ---"
            adb shell run-as '"$PKG"' sh /data/local/tmp/verify-run.sh node /data/local/tmp/verify-probe.cjs
            echo "--- run-as wrapper: git + bash ---"
            adb shell run-as '"$PKG"' sh /data/local/tmp/verify-run.sh git --version
            adb shell run-as '"$PKG"' sh /data/local/tmp/verify-run.sh bash --version | head -1
          '

      - name: openssl-offline | OpenSSL init + verified TLS handshake, still offline
        run: |
          # Device failure 2 acceptance (owner, 2026-10-28): "OpenSSL
          # initializes without accessing /data/data/com.termux/".
          # Full TLS handshake with verification on loopback — ZERO network,
          # so any success is download-free and Termux-free.
          source /tmp/verify-stage-lib.sh
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/verify-tls-key.pem \
            -out /tmp/verify-tls-cert.pem -days 2 -nodes -subj "/CN=localhost" \
            > /dev/null 2>&1
          adb push scripts/embedded/assets/verify-tls-offline-probe.cjs /data/local/tmp/verify-tls-offline-probe.cjs > /dev/null
          adb push /tmp/verify-tls-cert.pem /data/local/tmp/verify-tls-cert.pem > /dev/null
          adb push /tmp/verify-tls-key.pem /data/local/tmp/verify-tls-key.pem > /dev/null
          stage_run openssl-offline -- bash -c '
            set -e
            adb shell run-as '"$PKG"' sh /data/local/tmp/verify-run.sh node /data/local/tmp/verify-tls-offline-probe.cjs \
              /data/local/tmp/verify-tls-cert.pem /data/local/tmp/verify-tls-key.pem
          '

      - name: start-tap | drive "Start ZCode" (embedded web server + mock provider)
        run: |
          source /tmp/verify-stage-lib.sh
          stage_run start-tap -- bash -c '
            set -e
            ui_tap_text "Start ZCode" 120 || exit 1
            OK=0
            for i in $(seq 1 60); do
              if ui_has_text "Running"; then OK=1; echo "running after ~$((i*3))s"; break; fi
              if ui_has_text "Failed"; then echo "start FAILED on-device"; ui_dump; grep -o "Failed[^<]*" "$LOGS_DIR/ui-dump.xml" | head -3; break; fi
              dismiss_anr || true
              sleep 3
            done
            shot running
            [ "$OK" = "1" ] || exit 1
            sleep 3
            # PROJECT REGISTRATION (official saveProject RPC): upstream gives
            # the standalone HTTP server a remote-style storage identity, so
            # session creation (draft sessions) fails with
            # project.remote-project-required until the workspace root is
            # registered. The app registers it automatically after the server
            # is healthy (register-workspace-project.cjs). A run whose app
            # cannot register the workspace is NOT green — draft sessions
            # would fail on the phone exactly as the owner reported.
            REG=0
            for i in $(seq 1 30); do
              if adb logcat -d | grep -E "\\[register\\].*(VERIFIED|already registered)|project registration OK" >/dev/null 2>&1; then REG=1; break; fi
              sleep 3
            done
            echo "--- project registration evidence (logcat [register] lines) ---"
            adb logcat -d | grep "\[register\]" | tail -8 || true
            if [ "$REG" = "1" ]; then echo "PROJECT REGISTRATION: VERIFIED on device"; else echo "FAIL: workspace never registered as project root"; exit 1; fi
            echo "--- app log (logcat tail, app tag) ---"
            adb logcat -d | grep -E "zcode|agent\||mock\|" | tail -25 || true
          '

      - name: frontend-smoke | open WebView, capture console + DOM state + HONEST render verdict
        run: |
          source /tmp/verify-stage-lib.sh
          stage_run frontend-smoke -- bash -c '
            set -e
            adb logcat -c || true
            ui_tap_text "Open ZCode" 60 || { echo "FAIL: Open ZCode button not found"; exit 1; }
            echo "tapped Open ZCode; waiting 45s for frontend boot + evidence sequence..."
            sleep 45
            shot frontend-open
            ui_dump || true
            # preserve the dump of THIS stage (later stages overwrite ui-dump.xml)
            cp "$LOGS_DIR/ui-dump.xml" "$LOGS_DIR/frontend-smoke-ui.xml" 2>/dev/null || true
            python3 /tmp/verify-webview-bounds.py || true
            if grep -q "android.webkit.WebView" "$LOGS_DIR/ui-dump.xml" 2>/dev/null; then
              echo "WebView node present in UI dump"
            else
              echo "WARN: no android.webkit.WebView node in UI dump"
            fi
            adb logcat -d > "$LOGS_DIR/frontend-smoke-logcat.txt" 2>/dev/null || true
            echo "--- JS console (chromium CONSOLE lines) ---"
            grep -E "INFO:CONSOLE|:CONSOLE" "$LOGS_DIR/frontend-smoke-logcat.txt" | tail -40 || true
            echo "--- fatal UI signals ---"
            grep -E "Uncaught|SyntaxError|ReferenceError|net::ERR|Render process gone|RENDERER GONE" "$LOGS_DIR/frontend-smoke-logcat.txt" | tail -20 || true
            echo "--- app-side webview evidence (ZCodeWeb tag: lifecycle + dom-state + probes) ---"
            grep "ZCodeWeb" "$LOGS_DIR/frontend-smoke-logcat.txt" | tail -60 || true
            echo "--- visual paint evidence (failure-3 suite: visual-state / bitmap / force-vis / layout-repair / minimal-html) ---"
            grep -E "visual-state|bitmap|force-vis|styles-restored|layout-repair|layout-restored|minimal-html|shot saved|config C|first layout|fallback load" "$LOGS_DIR/frontend-smoke-logcat.txt" | tail -45 || true
            grep -q "android.webkit.WebView" "$LOGS_DIR/ui-dump.xml" 2>/dev/null || { echo "FAIL: WebView absent - evidence could not be collected"; exit 1; }
            echo "--- HONEST RENDER VERDICT (green == the UI actually renders) ---"
            python3 /tmp/verify-render-verdict.py "$LOGS_DIR/frontend-smoke-logcat.txt"
            echo "FRONTEND-SMOKE: evidence collected AND render verdict PASSED"
            ui_tap_text "Status" 30 || adb shell input keyevent KEYCODE_BACK || true
          '

      - name: frontend-smoke-b | A/B with edge-to-edge OFF + HONEST render verdict
        run: |
          source /tmp/verify-stage-lib.sh
          stage_run frontend-smoke-b -- bash -c '
            set -e
            # CONFIG B: the MainActivity skips enableEdgeToEdge() when this
            # marker exists (runtime diagnostic hook). The foreground-service
            # runtime is killed by force-stop, so the full start flow repeats.
            adb shell run-as '"$PKG"' sh -c "echo off > /data/data/$PKG/files/config-edge-to-edge-off"
            MARK=$(adb shell run-as '"$PKG"' ls /data/data/$PKG/files/config-edge-to-edge-off | tr -d "\r")
            [ -n "$MARK" ] || { echo "FAIL: marker not written (config B)"; exit 1; }
            adb shell am force-stop '"$PKG"' || true
            sleep 3
            adb shell am start -n '"$PKG"'/.MainActivity > /dev/null
            sleep 8
            ui_tap_text "Start ZCode" 120 || { echo "FAIL: Start ZCode not found (config B)"; exit 1; }
            OK=0
            for i in $(seq 1 60); do
              if ui_has_text "Running"; then OK=1; break; fi
              if ui_has_text "Failed"; then echo "start FAILED (config B)"; break; fi
              dismiss_anr || true
              sleep 3
            done
            [ "$OK" = "1" ] || { echo "FAIL: not Running (config B)"; exit 1; }
            adb logcat -c || true
            ui_tap_text "Open ZCode" 60 || { echo "FAIL: Open ZCode not found (config B)"; exit 1; }
            sleep 45
            shot frontend-b-open
            ui_dump || true
            cp "$LOGS_DIR/ui-dump.xml" "$LOGS_DIR/frontend-smoke-b-ui.xml" 2>/dev/null || true
            adb logcat -d > "$LOGS_DIR/frontend-smoke-b-logcat.txt" 2>/dev/null || true
            echo "--- CONFIG B (edge-to-edge OFF) visual paint evidence ---"
            grep -E "visual-state|bitmap|force-vis|layout-repair|minimal-html|edge-to-edge|first layout|config C" "$LOGS_DIR/frontend-smoke-b-logcat.txt" | tail -45 || true
            echo "--- CONFIG B HONEST RENDER VERDICT ---"
            python3 /tmp/verify-render-verdict.py "$LOGS_DIR/frontend-smoke-b-logcat.txt"
            echo "CONFIG-B: evidence collected AND render verdict PASSED"
            ui_tap_text "Status" 30 || adb shell input keyevent KEYCODE_BACK || true
          '

      - name: agent-loop | ON-DEVICE agent loop with embedded mock (offline)
        run: |
          source /tmp/verify-stage-lib.sh
          adb push scripts/embedded/assets/verify-agent-driver.cjs /data/local/tmp/verify-agent-driver.cjs > /dev/null
          stage_run agent-loop -- bash -c '
            set -e
            adb shell run-as '"$PKG"' sh /data/local/tmp/verify-run.sh node /data/local/tmp/verify-agent-driver.cjs \
              --agent '"$RT"'/dist/zcode/agent/zcode.cjs --workspace '"$WS"' --timeout 240
          '

      - name: agent-effects | agent effects on disk (not app messages)
        run: |
          source /tmp/verify-stage-lib.sh
          stage_run agent-effects -- bash -c '
            set -e
            echo "--- hello.txt (Write tool) ---"
            adb shell run-as '"$PKG"' sh /data/local/tmp/verify-run.sh cat '"$WS"'/hello.txt
            adb shell run-as '"$PKG"' sh /data/local/tmp/verify-run.sh cat '"$WS"'/hello.txt | grep -q "verify mock write" || { echo "ASSERT FAIL: file write"; exit 1; }
            echo "--- bash-marker.txt (Bash tool) ---"
            adb shell run-as '"$PKG"' sh /data/local/tmp/verify-run.sh cat '"$WS"'/bash-marker.txt
            adb shell run-as '"$PKG"' sh /data/local/tmp/verify-run.sh cat '"$WS"'/bash-marker.txt | grep -q "VERIFY-BASH-OK" || { echo "ASSERT FAIL: bash marker"; exit 2; }
            echo "--- git commit (Bash tool) ---"
            # flat args only: `sh -c "cd $WS && git ..."` lost its quoting
            # through adb shell in run #5 (git ran un-wrapped) — workflow/setup
            adb shell run-as '"$PKG"' sh /data/local/tmp/verify-run.sh git -C $WS log -1 --format=%H%n%s
            adb shell run-as '"$PKG"' sh /data/local/tmp/verify-run.sh git -C $WS log -1 --format=%s | grep -q "VERIFY-MOCK-COMMIT" || { echo "ASSERT FAIL: git commit"; exit 3; }
            echo "--- mock request log (on-device, evidence) ---"
            adb shell run-as '"$PKG"' sh /data/local/tmp/verify-run.sh tail -6 $RT/mock.log || true
            echo "ALL AGENT EFFECTS VERIFIED ON DEVICE"
            shot agent-effects
          '

      - name: persistence | force-stop + relaunch (no re-provision, files survive)
        run: |
          source /tmp/verify-stage-lib.sh
          stage_run persistence -- bash -c '
            set -e
            BEFORE=$(adb shell run-as '"$PKG"' sha256sum files/runtime/provision-complete.json | cut -d" " -f1)
            echo "marker sha before restart: $BEFORE"
            adb shell am force-stop '"$PKG"'
            sleep 3
            adb shell monkey -p '"$PKG"' -c android.intent.category.LAUNCHER 1 > /dev/null 2>&1 || true
            sleep 8
            # belt-and-braces: if the POST_NOTIFICATIONS dialog still pops
            # (grant raced), dismiss it — it covers the app window
            if ui_has_text "send you notifications"; then
              echo "notification permission dialog detected -> tapping reject"
              ui_tap_text "t allow" 10 || true
              sleep 2
            fi
            OK=0
            for i in $(seq 1 40); do
              if ui_has_text "Ready"; then OK=1; break; fi
              if ui_has_text "Setup required"; then echo "FATAL: app forgot provisioning (marker lost)"; break; fi
              dismiss_anr || true
              sleep 3
            done
            shot after-restart
            [ "$OK" = "1" ] || { echo "FAIL: Ready state not reached after restart"; exit 1; }
            AFTER=$(adb shell run-as '"$PKG"' sha256sum files/runtime/provision-complete.json | cut -d" " -f1)
            echo "marker sha after restart:  $AFTER"
            [ "$BEFORE" = "$AFTER" ] || { echo "FAIL: marker changed — re-provision happened"; exit 2; }
            adb shell run-as '"$PKG"' sh /data/local/tmp/verify-run.sh cat '"$WS"'/hello.txt | grep -q "verify mock write" \
              || { echo "FAIL: workspace files lost after restart"; exit 3; }
            echo "--- restart node exec again (same extracted runtime) ---"
            adb shell run-as '"$PKG"' sh /data/local/tmp/verify-run.sh node --version
            echo "PERSISTENCE OK: same marker, files intact, runtime reused (offline; no downloads possible)"
          '

      - name: tls-https | real HTTPS request with certificate verification (network ON)
        run: |
          # Failure 2 acceptance (owner, 2026-10-28): "A real HTTPS request
          # succeeds with certificate verification enabled". Network is
          # re-enabled HERE, after all offline criteria are proven, so the
          # offline guarantees above remain download-free.
          source /tmp/verify-stage-lib.sh
          adb push scripts/embedded/assets/verify-tls-https-probe.cjs /data/local/tmp/verify-tls-https-probe.cjs > /dev/null
          stage_run net-restore -- bash -c '
            set -e
            # the offline stage disabled airplane-mode AND wifi AND data —
            # re-enable all three. Known emulator quirk (runs 40602719913 /
            # 40606283651): airplane-mode disable does NOT restore the
            # default network within 120s on API 33 images. Primary check is
            # dumpsys (no ICMP dependency); deterministic fallback = reboot.
            adb shell cmd connectivity airplane-mode disable
            adb shell svc wifi enable || true
            adb shell svc data enable || true
            restored=0
            for i in $(seq 1 30); do
              sleep 2
              if adb shell dumpsys connectivity 2>/dev/null | grep -q "Active default network: [0-9]"; then
                echo "network restored after ~$((i*2))s"; restored=1; break
              fi
            done
            if [ "$restored" != "1" ]; then
              echo "network did not return via airplane toggle -> rebooting emulator (deterministic restore)"
              adb reboot || true
              adb wait-for-device
              for i in $(seq 1 60); do
                b=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" || true)
                [ "$b" = "1" ] && break
                sleep 3
              done
              sleep 15
              adb shell svc wifi enable || true
              adb shell svc data enable || true
              for i in $(seq 1 30); do
                sleep 2
                if adb shell dumpsys connectivity 2>/dev/null | grep -q "Active default network: [0-9]"; then
                  echo "network restored after reboot (~$((i*2))s)"; restored=1; break
                fi
              done
            fi
            [ "$restored" = "1" ] || { echo "FATAL: network did not return"; exit 1; }
          '
          stage_run tls-https -- bash -c '
            set -e
            adb shell run-as '"$PKG"' sh /data/local/tmp/verify-run.sh node /data/local/tmp/verify-tls-https-probe.cjs https://api.github.com/zen
          '

      - name: report | classification summary (owner rules, no auto-PRoot)
        if: always()
        run: |
          python3 - "$RESULTS_DIR" <<'PY'
          import json, os, sys
          d = sys.argv[1]
          stages = ["install", "offline", "setup-tap", "node-probe", "openssl-offline", "start-tap",
                    "frontend-smoke", "agent-loop", "agent-effects", "persistence", "net-restore", "tls-https", "emu-boot"]
          rows = []
          for s in stages:
              p = os.path.join(d, s + ".json")
              rows.append(json.load(open(p)) if os.path.exists(p)
                          else {"stage": s, "status": "NOT RUN"})
          cls = {
              "install": "APK packaging (must pass)",
              "offline": "test precondition (must pass)",
              "setup-tap": "offline provisioning from embedded assets (criterion 1)",
              "node-probe": "embedded node/git/bash exec on Android userspace (criterion 2; ARM64 proof deferred to device)",
              "openssl-offline": "OpenSSL init inside app runtime + verified TLS handshake, ZERO network (failure-2 acceptance; Termux-path leak = FAIL)",
              "start-tap": "official ZCode --web + embedded mock on-device",
              "frontend-smoke": "black-screen evidence: WebView lifecycle + JS console + DOM state + visual-state/bitmap/force-vis/layout-repair/minimal-html paint suite (render verdict is evidence, not CI green)",
              "frontend-smoke-b": "edge-to-edge OFF A/B: isolates the WebView viewport-unit collapse trigger (runtime marker, force-stop + full restart)",
              "agent-loop": "real agent loop end-to-end (mock model; auth/billing NOT exercised)",
              "agent-effects": "agent effects verified on disk (criterion 3 mechanics)",
              "persistence": "restart survival, no re-provision (criterion 5 mechanics)",
              "net-restore": "test precondition for tls-https (not a device criterion)",
              "tls-https": "real HTTPS with certificate verification enabled (failure-2 acceptance; x86_64 AVD app-level evidence only)",
              "emu-boot": "workflow/setup — fix the test, never a Bionic verdict",
          }
          print(json.dumps({"scope": "x86_64 AVD app-level only; ARM64/device NOT proven here",
                            "stages": rows}, indent=2))
          with open(os.path.join(d, "summary.json"), "w") as f:
              json.dump({"scope": "x86_64 AVD app-level only", "stages": rows, "notes": cls}, f, indent=2)
          bad = [r for r in rows if r["status"] not in ("PASS", "NOT RUN")]
          if bad:
              print("FAILING STAGES:", [r["stage"] for r in bad])
              sys.exit(1)
          PY

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-verify-evidence
          path: |
            /tmp/verify-logs/**
            /tmp/verify-results/**
          if-no-files-found: warn
